<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#003B5C"/>
      <stop offset="100%" stop-color="#001020"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFD100" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFD100" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="380" ry="220" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Subtle stars -->
  <g fill="white" opacity="0.4">
    <circle cx="82" cy="54" r="1.1"/><circle cx="210" cy="38" r="0.7"/>
    <circle cx="960" cy="44" r="0.8"/><circle cx="1080" cy="90" r="1.0"/>
    <circle cx="50" cy="420" r="0.9"/><circle cx="1150" cy="380" r="0.8"/>
    <circle cx="180" cy="560" r="1.0"/><circle cx="1020" cy="540" r="0.9"/>
    <circle cx="340" cy="600" r="0.7"/><circle cx="820" cy="590" r="0.8"/>
    <circle cx="1160" cy="200" r="0.7"/><circle cx="40" cy="200" r="0.9"/>
  </g>
  <g fill="#FFE566" opacity="0.45">
    <circle cx="144" cy="112" r="1.0"/><circle cx="1060" cy="130" r="0.9"/>
    <circle cx="130" cy="490" r="0.9"/><circle cx="1070" cy="470" r="1.0"/>
  </g>

  <!-- Top ornament line -->
  <line x1="420" y1="220" x2="780" y2="220" stroke="#FFD100" stroke-width="0.7" opacity="0.35"/>
  <circle cx="600" cy="220" r="3" fill="#FFD100" opacity="0.6"/>

  <!-- Main text -->
  <text x="600" y="310" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="90" font-style="italic" font-weight="normal"
    fill="#FFD100" opacity="0.95">Graduation</text>
  <text x="600" y="400" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="90" font-style="italic" font-weight="normal"
    fill="#FFD100" opacity="0.95">Celebration</text>

  <!-- Bottom ornament line -->
  <line x1="420" y1="430" x2="780" y2="430" stroke="#FFD100" stroke-width="0.7" opacity="0.35"/>
  <circle cx="600" cy="430" r="3" fill="#FFD100" opacity="0.6"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#FFD100" stroke-width="0.6" opacity="0.18" rx="4"/>
</svg>
