<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#003B5C"/>
      <stop offset="100%" stop-color="#001020"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD100" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD100" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow center -->
  <ellipse cx="600" cy="315" rx="420" ry="260" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.55">
    <circle cx="82" cy="54" r="1.2"/><circle cx="210" cy="38" r="0.8"/><circle cx="340" cy="72" r="1.4"/>
    <circle cx="460" cy="28" r="0.9"/><circle cx="580" cy="56" r="1.1"/><circle cx="720" cy="34" r="0.7"/>
    <circle cx="840" cy="62" r="1.3"/><circle cx="960" cy="44" r="0.9"/><circle cx="1080" cy="30" r="1.1"/>
    <circle cx="1140" cy="70" r="0.8"/><circle cx="50" cy="150" r="0.9"/><circle cx="150" cy="200" r="1.2"/>
    <circle cx="1050" cy="160" r="1.0"/><circle cx="1150" cy="220" r="0.8"/>
    <circle cx="100" cy="420" r="1.1"/><circle cx="1100" cy="400" r="0.9"/>
    <circle cx="60" cy="530" r="0.8"/><circle cx="200" cy="580" r="1.0"/>
    <circle cx="1020" cy="540" r="1.2"/><circle cx="1160" cy="510" r="0.8"/>
    <circle cx="380" cy="590" r="0.7"/><circle cx="820" cy="600" r="0.9"/>
    <circle cx="480" cy="610" r="1.0"/><circle cx="700" cy="595" r="0.8"/>
  </g>
  <!-- Gold warm stars -->
  <g fill="#FFE566" opacity="0.5">
    <circle cx="144" cy="112" r="1.2"/><circle cx="290" cy="148" r="0.9"/>
    <circle cx="900" cy="88" r="1.1"/><circle cx="1020" cy="130" r="0.8"/>
    <circle cx="130" cy="490" r="1.0"/><circle cx="1070" cy="470" r="1.1"/>
  </g>

  <!-- Compass rose (top center) -->
  <g transform="translate(600,92)" opacity="0.7">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#FFD100" stroke-width="0.8" opacity="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#FFD100"/>
    <polygon points="0,-26 -3,-14 0,-16 3,-14" fill="#FFD100"/>
    <polygon points="0,26 -3,14 0,16 3,14" fill="#FFD100" opacity="0.5"/>
    <polygon points="26,0 14,-3 16,0 14,3" fill="#FFD100" opacity="0.5"/>
    <polygon points="-26,0 -14,-3 -16,0 -14,3" fill="#FFD100" opacity="0.5"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#FFD100" stroke-width="0.5" opacity="0.3"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#FFD100" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Top divider line -->
  <line x1="350" y1="138" x2="850" y2="138" stroke="#FFD100" stroke-width="0.6" opacity="0.3"/>

  <!-- Eyebrow text -->
  <text x="600" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="6" fill="#B8CCE8" opacity="0.9" text-transform="uppercase">YOU ARE INVITED TO CELEBRATE</text>

  <!-- Main name -->
  <text x="600" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" letter-spacing="8" fill="none" stroke="#FFD100" stroke-width="0.5">
    <tspan fill="#FFF6C2">SHIVANSH</tspan>
  </text>
  <text x="600" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" letter-spacing="8" fill="#FFD100" opacity="0.92">SHIVANSH</text>

  <!-- Milestone divider -->
  <line x1="280" y1="300" x2="510" y2="300" stroke="#FFD100" stroke-width="0.8" opacity="0.4"/>
  <text x="600" y="308" text-anchor="middle" font-family="serif" font-size="22" fill="#FFD100">🎓</text>
  <line x1="690" y1="300" x2="920" y2="300" stroke="#FFD100" stroke-width="0.8" opacity="0.4"/>

  <!-- Occasion -->
  <text x="600" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#F0EBE0" opacity="0.95">Graduation Celebration</text>

  <!-- Tag line -->
  <text x="600" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#B8CCE8" opacity="0.8">"One chapter closes. The whole world opens."</text>

  <!-- Bottom divider -->
  <line x1="300" y1="418" x2="900" y2="418" stroke="#FFD100" stroke-width="0.6" opacity="0.25"/>

  <!-- Details row -->
  <text x="600" y="460" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" fill="#FFD100">SUNDAY, AUGUST 2ND, 2026</text>
  <text x="600" y="492" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#B8CCE8">5:30 PM  ✦  ROYALE SAKOON, FREMONT, CA  ✦  INDO-WESTERN / SUITS</text>

  <!-- Bottom divider -->
  <line x1="300" y1="518" x2="900" y2="518" stroke="#FFD100" stroke-width="0.6" opacity="0.25"/>

  <!-- Hosted by -->
  <text x="600" y="558" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#6A8DAA">HOSTED BY THE BANSAL FAMILY</text>

  <!-- Corner ornaments -->
  <g opacity="0.35" stroke="#FFD100" stroke-width="0.8" fill="none">
    <line x1="40" y1="40" x2="80" y2="40"/><line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="1160" y1="40" x2="1120" y2="40"/><line x1="1160" y1="40" x2="1160" y2="80"/>
    <line x1="40" y1="590" x2="80" y2="590"/><line x1="40" y1="590" x2="40" y2="550"/>
    <line x1="1160" y1="590" x2="1120" y2="590"/><line x1="1160" y1="590" x2="1160" y2="550"/>
  </g>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#FFD100" stroke-width="0.6" opacity="0.2" rx="4"/>
</svg>
